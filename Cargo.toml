[package]
name = "miora-core"
version = "0.3.0"
edition = "2024"
description = "Offline-first menstrual cycle and symptom tracking core."
license = "MIT"

[lib]
name = "miora"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
