name: Pin dependency lockfiles

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pin-lockfiles.yml"

permissions:
  contents: write

jobs:
  pin:
    name: Generate and commit dependency lockfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Generate lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix web
          cargo generate-lockfile
          cargo generate-lockfile --manifest-path web/src-tauri/Cargo.toml

      - name: Commit lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock web/package-lock.json web/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Dependency lockfiles are already up to date."
            exit 0
          fi
          git commit -m "chore: pin dependency lockfiles [skip ci]"
          git push origin HEAD:main
