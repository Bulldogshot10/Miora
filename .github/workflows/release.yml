name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android-release:
    name: Build signed Android release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux dependencies for host-side UniFFI bindgen
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.4"

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17.0.21+9"
          cache: gradle
          cache-dependency-path: |
            web/package-lock.json
            web/src-tauri/tauri.conf.json
            web/src-tauri/Cargo.lock

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Install Android platform and NDK
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;30.0.16248370"
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          TOOLCHAIN_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TOOLCHAIN_BIN/llvm-ar"
          test -x "$TOOLCHAIN_BIN/llvm-ranlib"
          ln -sf llvm-ar "$TOOLCHAIN_BIN/aarch64-linux-android-ar"
          ln -sf llvm-ranlib "$TOOLCHAIN_BIN/aarch64-linux-android-ranlib"
          echo "RANLIB=$TOOLCHAIN_BIN/llvm-ranlib" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"
          targets: aarch64-linux-android

      - name: Verify and prefetch committed lockfiles
        run: |
          test -s Cargo.lock
          test -s web/package-lock.json
          test -s web/src-tauri/Cargo.lock
          cargo fetch --locked
          cargo fetch --locked --manifest-path web/src-tauri/Cargo.toml

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.23.0 --locked

      - name: Audit Rust dependencies
        run: |
          cargo audit --target-arch aarch64 --target-os android --ignore RUSTSEC-2026-0374 --ignore RUSTSEC-2024-0370 --file Cargo.lock
          cargo audit --target-arch aarch64 --target-os android --ignore RUSTSEC-2026-0374 --ignore RUSTSEC-2024-0370 --file web/src-tauri/Cargo.lock

      - name: Install Web dependencies
        run: npm ci --prefix web --no-audit --no-fund

      - name: Set Android release version metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?", tag):
              raise SystemExit(f"Invalid Android release tag: {tag!r}; expected vMAJOR.MINOR.PATCH[-prerelease].")

          version_code = int(os.environ["RELEASE_VERSION_CODE"])
          if not 1 <= version_code <= 2_100_000_000:
              raise SystemExit(f"Android version code is outside the supported range: {version_code}")

          config_path = Path("web/src-tauri/tauri.conf.json")
          config = json.loads(config_path.read_text())
          config["version"] = tag[1:]
          config.setdefault("bundle", {}).setdefault("android", {})["versionCode"] = version_code
          config_path.write_text(json.dumps(config, indent=2) + "\n")
          print(f"Android release version: {config['version']} (versionCode {version_code})")
          PY

      - name: Audit Web dependencies
        run: |
          python3 .github/scripts/audit-npm.py
          npm audit --omit=dev --audit-level=high --prefix web

      - name: Initialize Tauri Android project
        run: npm run tauri:android:init --prefix web

      - name: Generate application icons
        run: npm run tauri:icons --prefix web

      - name: Configure Android signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
        run: |
          STORE_PASSWORD="${ANDROID_KEY_STORE_PASSWORD:-$ANDROID_KEY_PASSWORD}"
          if [ -z "$ANDROID_KEY_BASE64" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::Configure ANDROID_KEY_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, and optionally ANDROID_KEY_STORE_PASSWORD."
            exit 1
          fi

          cd web/src-tauri/gen/android
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/miora-release.jks"
          {
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "storePassword=$STORE_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/miora-release.jks"
          } > keystore.properties

          python3 - <<'PY'
          from pathlib import Path

          gradle_file = Path("app/build.gradle.kts")
          source = gradle_file.read_text()

          if "import java.io.FileInputStream" not in source:
              source = "import java.io.FileInputStream\nimport java.util.Properties\n\n" + source

          signing_block = '''
          signingConfigs {
              create("release") {
                  val keystorePropertiesFile = rootProject.file("keystore.properties")
                  val keystoreProperties = Properties()
                  keystoreProperties.load(FileInputStream(keystorePropertiesFile))
                  keyAlias = keystoreProperties["keyAlias"] as String
                  keyPassword = keystoreProperties["keyPassword"] as String
                  storeFile = file(keystoreProperties["storeFile"] as String)
                  storePassword = keystoreProperties["storePassword"] as String
              }
          }

          '''

          if 'create("release")' not in source:
              if "buildTypes {" not in source:
                  raise SystemExit("Could not find the Gradle buildTypes block; refusing to create an unsigned release.")
              source = source.replace("buildTypes {", signing_block + "buildTypes {", 1)

          release_marker = 'getByName("release") {'
          if release_marker not in source:
              raise SystemExit("Could not find the release build type; refusing to create an unsigned release.")

          signing_line = 'signingConfig = signingConfigs.getByName("release")'
          if signing_line not in source:
              source = source.replace(
                  release_marker,
                  release_marker + '\n            ' + signing_line,
                  1
              )

          if signing_line not in source or 'create("release")' not in source:
              raise SystemExit("Release signing config was not applied.")

          gradle_file.write_text(source)
          PY

      - name: Build signed release APK (retry Maven Central HTTP 429)
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          for attempt in 1 2 3; do
            log_file="$RUNNER_TEMP/miora-release-build-$attempt.log"
            set +e
            npm run tauri:android:release --prefix web >"$log_file" 2>&1
            status=$?
            set -e
            cat "$log_file"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if ! grep -Eiq 'HTTP.*429|status code 429|Too Many Requests' "$log_file"; then
              exit "$status"
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Maven Central continued returning HTTP 429 after three release build attempts."
              exit "$status"
            fi
            sleep "$((attempt * 20))"
          done

      - name: Verify release APK signatures
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION_CODE: ${{ github.run_number }}
        run: |
          expected_version="${RELEASE_TAG#v}"
          mapfile -d '' apks < <(find web/src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print0)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          done

          for apk in "${apks[@]}"; do
            badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk")
            if ! grep -Fq "versionCode='$RELEASE_VERSION_CODE'" <<< "$badging"; then
              echo "::error::APK versionCode does not match workflow run number $RELEASE_VERSION_CODE."
              exit 1
            fi
            if ! grep -Fq "versionName='$expected_version'" <<< "$badging"; then
              echo "::error::APK versionName does not match release tag $expected_version."
              exit 1
            fi
          done

          for apk in "${apks[@]}"; do
            if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$apk" | grep -q "android.permission.INTERNET"; then
              echo "::error::Release APK still declares android.permission.INTERNET."
              exit 1
            fi
          done

      - name: Generate SHA-256 checksum
        run: |
          find web/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print0 \
            | xargs -0 sha256sum > web/src-tauri/gen/android/app/build/outputs/apk/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            web/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            web/src-tauri/gen/android/app/build/outputs/apk/SHA256SUMS.txt
            Cargo.lock
            web/package-lock.json
            web/src-tauri/Cargo.lock
