name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate the exact tagged revision
    uses: ./.github/workflows/ci.yml
    with:
      quality_only: false
    permissions:
      contents: read

  android-release:
    name: Build signed Android release
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux dependencies for host-side UniFFI bindgen
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17.0.21+9"
          cache: gradle
          cache-dependency-path: |
            web/package-lock.json
            web/src-tauri/tauri.conf.json
            web/src-tauri/Cargo.lock
            web/android-gradle-locks/**
            web/scripts/prepare-android-widget.mjs

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android platform and NDK
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;30.0.16248370"
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          TOOLCHAIN_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TOOLCHAIN_BIN/llvm-ar"
          test -x "$TOOLCHAIN_BIN/llvm-ranlib"
          ln -sf llvm-ar "$TOOLCHAIN_BIN/aarch64-linux-android-ar"
          ln -sf llvm-ranlib "$TOOLCHAIN_BIN/aarch64-linux-android-ranlib"
          echo "RANLIB=$TOOLCHAIN_BIN/llvm-ranlib" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"
          targets: aarch64-linux-android

      - name: Verify committed Rust and npm lockfiles
        run: |
          set -euo pipefail
          test -s Cargo.lock
          test -s web/package-lock.json
          test -s web/src-tauri/Cargo.lock
          cargo fetch --locked
          cargo fetch --locked --manifest-path web/src-tauri/Cargo.toml

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.23.0 --locked

      - name: Audit Rust dependencies
        run: |
          cargo audit --target-arch aarch64 --target-os android --ignore RUSTSEC-2026-0374 --ignore RUSTSEC-2024-0370 --file Cargo.lock
          cargo audit --target-arch aarch64 --target-os android --ignore RUSTSEC-2026-0374 --ignore RUSTSEC-2024-0370 --file web/src-tauri/Cargo.lock

      - name: Install Web dependencies
        run: npm ci --prefix web --no-audit --no-fund

      - name: Set Android release version metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?", tag):
              raise SystemExit(f"Invalid Android release tag: {tag!r}; expected vMAJOR.MINOR.PATCH[-prerelease].")

          # Tauri 0.3.0 currently maps to Android versionCode 3000.
          # Offset the monotonically increasing release run number above that baseline.
          version_code = 3_000 + int(os.environ["RELEASE_VERSION_CODE"])
          if not 1 <= version_code <= 2_100_000_000:
              raise SystemExit(f"Android version code is outside the supported range: {version_code}")

          config_path = Path("web/src-tauri/tauri.conf.json")
          config = json.loads(config_path.read_text())
          config["version"] = tag[1:]
          config.setdefault("bundle", {}).setdefault("android", {})["versionCode"] = version_code
          config_path.write_text(json.dumps(config, indent=2) + "\n")
          print(f"Android release version: {config['version']} (versionCode {version_code})")
          PY

      - name: Audit Web dependencies
        run: |
          python3 .github/scripts/audit-npm.py
          npm audit --omit=dev --audit-level=high --prefix web

      - name: Initialize Tauri Android project
        run: npm run tauri:android:init --prefix web

      - name: Download Gradle lock state from exact-tag validation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: miora-android-gradle-lockfiles
          path: ${{ runner.temp }}/miora-gradle-lockfiles

      - name: Verify Android Gradle lock state
        run: |
          set -euo pipefail
          locks="$RUNNER_TEMP/miora-gradle-lockfiles"
          test -s "$locks/app/gradle.lockfile"
          test -s "$locks/buildSrc/gradle.lockfile"
          test -s "$locks/buildSrc/buildscript-gradle.lockfile"
          test -s "$locks/buildscript-gradle.lockfile"
          test -s "$locks/external/tauri-android/gradle.lockfile"
          test -s "$locks/gradle/verification-metadata.xml"

          actual_files="$(find "$locks" -type f -printf '%P\\n' | sort)"
          expected_files="$(printf '%s\\n' \
            app/gradle.lockfile \
            buildSrc/buildscript-gradle.lockfile \
            buildSrc/gradle.lockfile \
            buildscript-gradle.lockfile \
            external/tauri-android/gradle.lockfile \
            gradle/verification-metadata.xml)"
          diff -u <(printf '%s\\n' "$expected_files") <(printf '%s\\n' "$actual_files")

          regular_lock_count="$(find "$locks" -type f -name 'gradle.lockfile' | wc -l | tr -d ' ')"
          buildscript_lock_count="$(find "$locks" -type f -name 'buildscript-gradle.lockfile' | wc -l | tr -d ' ')"
          test "$regular_lock_count" -eq 3
          test "$buildscript_lock_count" -eq 2

          python3 - "$locks/gradle/verification-metadata.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          component = root.find(".//{*}component[@group='com.android.tools.build'][@name='aapt2']")
          if component is None:
              raise SystemExit("Validation artifact has no AGP-matched AAPT2 verification component.")

          artifacts = component.findall("./{*}artifact")
          required = {
              "AAPT2 POM": lambda name: name.endswith(".pom"),
              "AAPT2 Linux binary JAR": lambda name: name.endswith("-linux.jar"),
          }
          for label, matches in required.items():
              artifact = next((item for item in artifacts if matches(item.get("name", ""))), None)
              if artifact is None or not artifact.findall("./{*}sha256"):
                  raise SystemExit(f"{label} is missing its SHA-256 verification entry.")
          print("Gradle lock artifact and AAPT2 SHA-256 verification metadata are valid.")
          PY

      - name: Generate application icons
        run: npm run tauri:icons --prefix web

      - name: Configure Android signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          STORE_PASSWORD="${ANDROID_KEY_STORE_PASSWORD:-$ANDROID_KEY_PASSWORD}"
          if [ -z "$ANDROID_KEY_BASE64" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::Configure ANDROID_KEY_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, and optionally ANDROID_KEY_STORE_PASSWORD."
            exit 1
          fi

          umask 077
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/miora-release.jks"
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/miora-release.jks"
          export ANDROID_KEYSTORE_PATH
          python3 web/scripts/configure-android-signing.py

      - name: Build signed release APK (retry Maven Central HTTP 429)
        env:
          CARGO_NET_OFFLINE: "true"
          MIORA_GRADLE_LOCKS_DIR: ${{ runner.temp }}/miora-gradle-lockfiles
        run: |
          for attempt in 1 2 3; do
            log_file="$RUNNER_TEMP/miora-release-build-$attempt.log"
            set +e
            npm run tauri:android:release --prefix web >"$log_file" 2>&1
            status=$?
            set -e
            cat "$log_file"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if ! grep -Eiq 'HTTP.*429|status code 429|Too Many Requests' "$log_file"; then
              exit "$status"
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Maven Central continued returning HTTP 429 after three release build attempts."
              exit "$status"
            fi
            sleep "$((attempt * 20))"
          done

      - name: Verify dependency lockfiles remained unchanged
        run: |
          set -euo pipefail
          git diff --exit-code -- Cargo.lock web/package-lock.json web/src-tauri/Cargo.lock

          locks="$RUNNER_TEMP/miora-gradle-lockfiles"
          tauri_android_dir="$(node web/scripts/tauri-android-project-dir.mjs)"
          while IFS= read -r -d '' file; do
            relative_path="${file#"$locks/"}"
            if [ "$relative_path" = "external/tauri-android/gradle.lockfile" ]; then
              destination="$tauri_android_dir/gradle.lockfile"
            else
              destination="web/src-tauri/gen/android/$relative_path"
            fi
            if [ ! -f "$destination" ]; then
              echo "::error::Gradle lock artifact was not applied to the release build: $relative_path"
              exit 1
            fi
            cmp "$file" "$destination"
          done < <(find "$locks" -type f -print0 | sort -z)

      - name: Verify release APK signatures
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION_CODE: ${{ github.run_number }}
        run: |
          expected_version="${RELEASE_TAG#v}"
          expected_version_code=$((3000 + RELEASE_VERSION_CODE))
          mapfile -d '' apks < <(find web/src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print0)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          done

          for apk in "${apks[@]}"; do
            badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk")
            if ! grep -Fq "package: name='com.bulldogshot10.miora'" <<< "$badging"; then
              echo "::error::APK package identifier does not match com.bulldogshot10.miora."
              exit 1
            fi
            if ! grep -Fq "versionCode='$expected_version_code'" <<< "$badging"; then
              echo "::error::APK versionCode does not match expected value $expected_version_code."
              exit 1
            fi
            if ! grep -Fq "versionName='$expected_version'" <<< "$badging"; then
              echo "::error::APK versionName does not match release tag $expected_version."
              exit 1
            fi
          done

          for apk in "${apks[@]}"; do
            if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$apk" | grep -q "android.permission.INTERNET"; then
              echo "::error::Release APK still declares android.permission.INTERNET."
              exit 1
            fi
          done

      - name: Generate SHA-256 checksum
        run: |
          find web/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print0 \
            | xargs -0 sha256sum > web/src-tauri/gen/android/app/build/outputs/apk/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@28ab305d0ffa26d60ec4bd614126329e26c7a0ec # v3.0.4
        with:
          generate_release_notes: true
          files: |
            web/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            web/src-tauri/gen/android/app/build/outputs/apk/SHA256SUMS.txt
            Cargo.lock
            web/package-lock.json
            web/src-tauri/Cargo.lock
            web/scripts/prepare-android-widget.mjs
