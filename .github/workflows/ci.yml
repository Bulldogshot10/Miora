name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      quality_only:
        description: "Run Rust/Web quality gates without the Android APK matrix."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust and Web quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy

      - name: Verify committed lockfiles
        run: |
          test -s Cargo.lock
          test -s web/package-lock.json
          test -s web/src-tauri/Cargo.lock
          cargo fetch --locked
          cargo fetch --locked --manifest-path web/src-tauri/Cargo.toml

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.23.0 --locked

      - name: Audit Rust dependencies
        run: |
          cargo audit --target-arch aarch64 --target-os android --ignore RUSTSEC-2026-0374 --ignore RUSTSEC-2024-0370 --file Cargo.lock
          cargo audit --target-arch aarch64 --target-os android --ignore RUSTSEC-2026-0374 --ignore RUSTSEC-2024-0370 --file web/src-tauri/Cargo.lock

      - name: Check Rust formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path web/src-tauri/Cargo.toml --all -- --check

      - name: Test Rust core
        run: CARGO_NET_OFFLINE=true cargo test --locked --all-targets

      - name: Lint Rust core
        run: CARGO_NET_OFFLINE=true cargo clippy --locked --all-targets -- -D warnings

      - name: Install Web dependencies
        run: npm ci --prefix web --no-audit --no-fund

      - name: Audit Web dependencies
        run: |
          python3 .github/scripts/audit-npm.py
          npm audit --omit=dev --audit-level=high --prefix web

      - name: Generate Tauri application icons
        run: npm run tauri:icons --prefix web

      - name: Check Svelte and TypeScript
        run: npm run check --prefix web

      - name: Test encrypted backup crypto
        run: npm run test:backup --prefix web

      - name: Build Web frontend
        run: npm run build --prefix web

      - name: Check Tauri host
        run: CARGO_NET_OFFLINE=true cargo check --locked --manifest-path web/src-tauri/Cargo.toml --all-targets

      - name: Test Tauri host integration
        run: CARGO_NET_OFFLINE=true cargo test --locked --manifest-path web/src-tauri/Cargo.toml --all-targets

  android:
    if: ${{ inputs.quality_only != true }}
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux dependencies for host-side UniFFI bindgen
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17.0.21+9"
          cache: gradle
          cache-dependency-path: |
            web/package-lock.json
            web/src-tauri/tauri.conf.json
            web/src-tauri/Cargo.lock
            web/android-gradle-locks/**
            web/scripts/prepare-android-widget.mjs

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android platform and NDK
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;30.0.16248370"
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          TOOLCHAIN_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TOOLCHAIN_BIN/llvm-ar"
          test -x "$TOOLCHAIN_BIN/llvm-ranlib"
          ln -sf llvm-ar "$TOOLCHAIN_BIN/aarch64-linux-android-ar"
          ln -sf llvm-ranlib "$TOOLCHAIN_BIN/aarch64-linux-android-ranlib"
          ln -sf llvm-ar "$TOOLCHAIN_BIN/x86_64-linux-android-ar"
          ln -sf llvm-ranlib "$TOOLCHAIN_BIN/x86_64-linux-android-ranlib"
          echo "RANLIB=$TOOLCHAIN_BIN/llvm-ranlib" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"
          targets: aarch64-linux-android

      - name: Install Rust x86_64 Android target for emulator tests
        run: rustup target add x86_64-linux-android

      - name: Verify and prefetch locked Rust dependencies
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path web/src-tauri/Cargo.toml
          cargo fetch --locked --target x86_64-linux-android
          cargo fetch --locked --target x86_64-linux-android --manifest-path web/src-tauri/Cargo.toml

      - name: Install Web dependencies
        run: npm ci --prefix web --no-audit --no-fund

      - name: Initialize Tauri Android project
        run: npm run tauri:android:init --prefix web

      - name: Generate application icons
        run: npm run tauri:icons --prefix web

      - name: Build debug APK (retry Maven Central HTTP 429)
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          for attempt in 1 2 3; do
            log_file="$RUNNER_TEMP/miora-android-build-$attempt.log"
            set +e
            npm run tauri:android:build --prefix web >"$log_file" 2>&1
            status=$?
            set -e
            cat "$log_file"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if ! grep -Eiq 'HTTP.*429|status code 429|Too Many Requests' "$log_file"; then
              exit "$status"
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Maven Central continued returning HTTP 429 after three Android build attempts."
              exit "$status"
            fi
            sleep "$((attempt * 20))"
          done

      - name: Verify debug APK exists
        run: |
          apks="$(find web/src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk')"
          if [ -z "$apks" ]; then
            echo "::error::Android build completed without producing an APK."
            exit 1
          fi
          while IFS= read -r apk; do
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.bulldogshot10.miora'"
          done <<< "$apks"


      - name: Build x86_64 debug APK for emulator runtime tests
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          set -euo pipefail
          arm64_apk="$(find web/src-tauri/gen/android/app/build/outputs/apk -type f -path '*/debug/*.apk' | sort | head -n 1)"
          test -n "$arm64_apk"
          cp "$arm64_apk" "$RUNNER_TEMP/miora-arm64-debug.apk"

          npm run tauri:android:prepare --prefix web
          (
            cd web
            npx tauri android build --apk --debug --target x86_64
          )

          x86_apk="$(find web/src-tauri/gen/android/app/build/outputs/apk -type f -path '*/debug/*.apk' | sort | head -n 1)"
          test -n "$x86_apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$x86_apk" | grep -F "package: name='com.bulldogshot10.miora'"
          cp "$x86_apk" "$RUNNER_TEMP/miora-x86_64-debug.apk"
          cp "$RUNNER_TEMP/miora-arm64-debug.apk" "$arm64_apk"

      - name: Run Android Keystore, database, and widget smoke tests on emulator
        timeout-minutes: 20
        run: |
          set -euo pipefail
          sdkmanager --install \
            "emulator" \
            "system-images;android-36;google_apis;x86_64"
          echo "no" | avdmanager create avd --force \
            --name miora-ci-api36 \
            --package "system-images;android-36;google_apis;x86_64" \
            --device pixel_2

          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            acceleration=on
          else
            acceleration=off
          fi
          "$ANDROID_HOME/emulator/emulator" \
            -avd miora-ci-api36 \
            -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data \
            -gpu swiftshader_indirect -accel "$acceleration" \
            >"$RUNNER_TEMP/miora-emulator.log" 2>&1 &
          adb start-server
          adb wait-for-device

          booted=""
          for attempt in $(seq 1 120); do
            booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$booted" = "1" ]; then break; fi
            sleep 5
          done
          if [ "$booted" != "1" ]; then
            cat "$RUNNER_TEMP/miora-emulator.log"
            echo "::error::Android emulator did not finish booting."
            exit 1
          fi
          adb shell input keyevent 82 || true

          package="com.bulldogshot10.miora"
          adb install -r "$RUNNER_TEMP/miora-x86_64-debug.apk"
          adb logcat -c
          adb shell monkey -p "$package" 1
          launched=""
          for attempt in $(seq 1 30); do
            launched="$(adb shell pidof "$package" 2>/dev/null | tr -d '\r')"
            if [ -n "$launched" ]; then break; fi
            sleep 2
          done
          if [ -z "$launched" ]; then
            adb logcat -d -t 4000
            echo "::error::Miora did not stay running after first launch."
            exit 1
          fi

          # Give the first launch time to create the encrypted database/key.
          sleep 8
          adb shell am force-stop "$package"
          adb logcat -c
          adb shell am broadcast \
            -a android.appwidget.action.APPWIDGET_UPDATE \
            -n "$package/$package.MioraWidgetProvider" \
            --eia appWidgetIds 1
          sleep 5
          widget_read="$(adb logcat -d -s MioraWidget:D | grep -F "encrypted_database_read_ok" || true)"
          if [ -z "$widget_read" ]; then
            adb logcat -d -t 4000
            echo "::error::The widget process could not reopen the Keystore-protected SQLCipher database."
            exit 1
          fi

          widget_registration="$(adb shell dumpsys package "$package" | grep -F "MioraWidgetProvider" || true)"
          if [ -z "$widget_registration" ]; then
            adb logcat -d -t 4000
            echo "::error::Miora widget provider is not registered in the installed package."
            exit 1
          fi

          adb shell monkey -p "$package" 1
          relaunched=""
          for attempt in $(seq 1 30); do
            relaunched="$(adb shell pidof "$package" 2>/dev/null | tr -d '\r')"
            if [ -n "$relaunched" ]; then break; fi
            sleep 2
          done
          if [ -z "$relaunched" ]; then
            adb logcat -d -t 4000
            echo "::error::Miora did not reopen its existing Keystore-protected database."
            exit 1
          fi

          fatal_logs="$(adb logcat -d -t 4000 | grep -E 'FATAL EXCEPTION|Fatal signal [0-9]+' || true)"
          if [ -n "$fatal_logs" ]; then
            printf '%s\n' "$fatal_logs"
            echo "::error::Miora crashed during app or widget runtime smoke tests."
            exit 1
          fi
          echo "Android emulator runtime smoke tests passed: install, launch, relaunch, Keystore-backed DB access, and widget update receiver."

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: miora-debug-apk
          path: web/src-tauri/gen/android/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Resolve Android Gradle locks and SHA-256 verification metadata
        if: ${{ hashFiles('web/android-gradle-locks/**') == '' }}
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          set -euo pipefail
          node web/scripts/prepare-android-widget.mjs --bootstrap-gradle-locks
          cd web/src-tauri/gen/android
          ./gradlew clean :app:clean :tauri-android:clean --stacktrace
          for attempt in 1 2 3; do
            log_file="$RUNNER_TEMP/miora-gradle-lock-bootstrap-$attempt.log"
            set +e
            ./gradlew --no-configuration-cache --write-locks --write-verification-metadata sha256 --init-script "$GITHUB_WORKSPACE/.github/scripts/resolve-android-aapt2.init.gradle" :dependencies :app:dependencies :app:packageUniversalReleaseResources --stacktrace >"$log_file" 2>&1
            status=$?
            set -e
            cat "$log_file"
            if [ "$status" -eq 0 ]; then
              break
            fi
            if ! grep -Eiq 'HTTP.*429|status code 429|Too Many Requests' "$log_file"; then
              exit "$status"
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Maven Central continued returning HTTP 429 while resolving Android Gradle locks."
              exit "$status"
            fi
            sleep "$((attempt * 20))"
          done

          tauri_android_dir="$(node "$GITHUB_WORKSPACE/web/scripts/tauri-android-project-dir.mjs")"
          python3 "$GITHUB_WORKSPACE/.github/scripts/record-androidapis-lock.py" \
            "app/gradle.lockfile" \
            "$tauri_android_dir/gradle.lockfile"
          test -s "$tauri_android_dir/gradle.lockfile"

          regular_lock_count="$(find . -type f -name 'gradle.lockfile' | wc -l | tr -d ' ')"
          regular_lock_count=$((regular_lock_count + 1))
          buildscript_lock_count="$(find . -type f -name 'buildscript-gradle.lockfile' | wc -l | tr -d ' ')"
          verification_count="$(find . -type f -name 'verification-metadata.xml' | wc -l | tr -d ' ')"
          echo "Generated project lockfiles: $regular_lock_count"
          echo "Generated buildscript lockfiles: $buildscript_lock_count"
          echo "Generated verification metadata files: $verification_count"
          find . -type f \( -name 'gradle.lockfile' -o -name 'buildscript-gradle.lockfile' -o -name 'verification-metadata.xml' \) -print | sort

          if [ "$regular_lock_count" -lt 3 ] || [ "$buildscript_lock_count" -lt 2 ]; then
            echo "::error::Gradle did not generate the complete project/buildscript lock state."
            exit 1
          fi
          if [ "$verification_count" -lt 1 ]; then
            echo "::error::Gradle did not generate dependency verification metadata."
            exit 1
          fi
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("gradle/verification-metadata.xml").getroot()
          component = root.find(".//{*}component[@group='com.android.tools.build'][@name='aapt2']")
          if component is None:
              raise SystemExit("AAPT2 is missing from Gradle dependency verification metadata.")
          artifacts = component.findall("./{*}artifact")
          required_artifacts = {
              "POM": next((item for item in artifacts if item.get("name", "").endswith(".pom")), None),
              "Linux binary JAR": next((item for item in artifacts if item.get("name", "").endswith("-linux.jar")), None),
          }
          for label, artifact in required_artifacts.items():
              if artifact is None or not artifact.findall("./{*}sha256"):
                  raise SystemExit(f"AAPT2 {label} is missing its SHA-256 verification entry.")
          print("AAPT2 POM and Linux binary JAR SHA-256 entries are present.")
          PY

          mkdir -p "$RUNNER_TEMP/miora-gradle-lockfiles"
          while IFS= read -r -d '' file; do
            relative_path="$(printf '%s' "$file" | sed 's#^\./##')"
            destination="$RUNNER_TEMP/miora-gradle-lockfiles/$relative_path"
            mkdir -p "$(dirname "$destination")"
            cp "$file" "$destination"
          done < <(
            find . -type f \( -name 'gradle.lockfile' -o -name 'buildscript-gradle.lockfile' -o -name 'verification-metadata.xml' \) -print0 | sort -z
          )
          mkdir -p "$RUNNER_TEMP/miora-gradle-lockfiles/external/tauri-android"
          cp "$tauri_android_dir/gradle.lockfile" "$RUNNER_TEMP/miora-gradle-lockfiles/external/tauri-android/gradle.lockfile"

      - name: Upload bootstrapped Gradle lockfiles
        if: ${{ hashFiles('web/android-gradle-locks/**') == '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: miora-android-gradle-lockfiles
          path: ${{ runner.temp }}/miora-gradle-lockfiles
          if-no-files-found: error
          retention-days: 7



      - name: Configure ephemeral Android release signing
        run: |
          set -euo pipefail
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/miora-ci-release.jks"
          export ANDROID_KEY_ALIAS="miora-ci"
          export ANDROID_KEY_PASSWORD="Miora-CI-Release-Only-2026"
          export ANDROID_KEY_STORE_PASSWORD="$ANDROID_KEY_PASSWORD"
          keytool -genkeypair -noprompt \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storetype JKS \
            -storepass "$ANDROID_KEY_STORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -dname "CN=Miora CI Release Smoke" \
            -keyalg RSA -keysize 2048 -validity 3650
          python3 web/scripts/configure-android-signing.py

      - name: Build signed release smoke APK (retry Maven Central HTTP 429)
        env:
          CARGO_NET_OFFLINE: "true"
          MIORA_GRADLE_LOCKS_DIR: ${{ runner.temp }}/miora-gradle-lockfiles
        run: |
          for attempt in 1 2 3; do
            log_file="$RUNNER_TEMP/miora-release-smoke-$attempt.log"
            set +e
            npm run tauri:android:release --prefix web >"$log_file" 2>&1
            status=$?
            set -e
            cat "$log_file"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if ! grep -Eiq 'HTTP.*429|status code 429|Too Many Requests' "$log_file"; then
              exit "$status"
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Maven Central continued returning HTTP 429 after three signed release smoke attempts."
              exit "$status"
            fi
            sleep "$((attempt * 20))"
          done

      - name: Verify signed release smoke APK
        run: |
          mapfile -d '' apks < <(find web/src-tauri/gen/android/app/build/outputs/apk -type f -path '*/release/*.apk' -print0)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No signed release APK was produced."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
            badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk")
            if ! grep -Fq "package: name='com.bulldogshot10.miora'" <<< "$badging"; then
              echo "::error::Release smoke APK package id is incorrect."
              exit 1
            fi
            if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$apk" | grep -q "android.permission.INTERNET"; then
              echo "::error::Release smoke APK declares android.permission.INTERNET."
              exit 1
            fi
          done

      - name: Verify dependency lockfiles remained unchanged
        run: |
          git diff --exit-code -- Cargo.lock web/package-lock.json web/src-tauri/Cargo.lock
          if [ -d web/android-gradle-locks ]; then
            git diff --exit-code -- web/android-gradle-locks
            if [ -n "$(git status --porcelain -- web/android-gradle-locks)" ]; then
              echo "::error::Committed Android Gradle lockfiles changed during the build."
              exit 1
            fi
            if [ -f web/android-gradle-locks/external/tauri-android/gradle.lockfile ]; then
              tauri_android_dir="$(node web/scripts/tauri-android-project-dir.mjs)"
              cmp web/android-gradle-locks/external/tauri-android/gradle.lockfile "$tauri_android_dir/gradle.lockfile"
            fi
          fi

          if [ -d "$RUNNER_TEMP/miora-gradle-lockfiles" ]; then
            tauri_android_dir="$(node web/scripts/tauri-android-project-dir.mjs)"
            while IFS= read -r -d '' file; do
              relative_path="${file#"$RUNNER_TEMP/miora-gradle-lockfiles/"}"
              if [ "$relative_path" = "external/tauri-android/gradle.lockfile" ]; then
                destination="$tauri_android_dir/gradle.lockfile"
              else
                destination="web/src-tauri/gen/android/$relative_path"
              fi
              if [ ! -f "$destination" ]; then
                echo "::error::Gradle lock artifact was not applied to release build: $relative_path"
                exit 1
              fi
              cmp "$file" "$destination"
            done < <(find "$RUNNER_TEMP/miora-gradle-lockfiles" -type f -print0 | sort -z)
          fi

