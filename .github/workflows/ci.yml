name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-lockfiles:
    name: Resolve dependency lockfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Generate lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix web
          cargo generate-lockfile
          cargo generate-lockfile --manifest-path web/src-tauri/Cargo.toml

      - name: Upload resolved lockfiles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: miora-dependency-lockfiles
          path: |
            Cargo.lock
            web/package-lock.json
            web/src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 3

  quality:
    name: Rust and Web quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path web/src-tauri/Cargo.toml --all -- --check

      - name: Test Rust core
        run: cargo test --all-targets

      - name: Lint Rust core
        run: cargo clippy --all-targets -- -D warnings

      - name: Install Web dependencies
        run: npm install --prefix web --no-audit --no-fund

      - name: Generate Tauri application icons
        run: npm run tauri:icons --prefix web

      - name: Check Svelte and TypeScript
        run: npm run check --prefix web

      - name: Build Web frontend
        run: npm run build --prefix web

      - name: Check Tauri host
        run: cargo check --manifest-path web/src-tauri/Cargo.toml --all-targets

      - name: Test Tauri host integration
        run: cargo test --manifest-path web/src-tauri/Cargo.toml --all-targets

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux dependencies for host-side UniFFI bindgen
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Install Android platform and NDK
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;30.0.16248370"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-linux-android

      - name: Install Web dependencies
        run: npm install --prefix web --no-audit --no-fund

      - name: Initialize Tauri Android project
        run: npm run tauri:android:init --prefix web

      - name: Generate application icons
        run: npm run tauri:icons --prefix web

      - name: Build debug APK
        run: npm run tauri:android:build --prefix web

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: miora-debug-apk
          path: web/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
