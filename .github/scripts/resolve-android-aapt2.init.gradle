// Resolve AGP's platform-specific AAPT2 artifact without invoking Tauri's
// Rust build tasks. A full :app:assemble* task calls the Tauri CLI bridge and
// requires cli-options-server.json, which only exists during a Tauri CLI build.
gradle.projectsEvaluated {
    def appProject = gradle.rootProject.findProject(":app")
    if (appProject == null) {
        throw new GradleException("Android application project :app was not configured.")
    }

    // AGP's Aapt2MavenUtils registers this configuration for its Google Maven
    // AAPT2 binary (group com.android.tools.build, module aapt2).
    def aapt2Configuration = appProject.configurations.findByName("_internal_aapt2_binary")
    if (aapt2Configuration == null) {
        throw new GradleException(
            "Android Gradle Plugin did not register _internal_aapt2_binary; " +
            "cannot produce verified AAPT2 lock metadata."
        )
    }

    def resolvedFiles = aapt2Configuration.resolve()
    def aapt2Jar = resolvedFiles.find {
        it.isFile() && it.name.startsWith("aapt2-") && it.name.endsWith("-linux.jar")
    }
    if (aapt2Jar == null || aapt2Jar.length() == 0L) {
        throw new GradleException(
            "Could not resolve the non-empty Linux AAPT2 JAR from _internal_aapt2_binary."
        )
    }

    println("Resolved AGP Linux AAPT2 artifact: ${aapt2Jar.name} (${aapt2Jar.length()} bytes)")
}
